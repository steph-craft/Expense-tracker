<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <h1 class="logo">Expense Tracker</h1>
      <div class="home-currency-control">
        <label for="home-currency">Home currency</label>
        <select id="home-currency"></select>
      </div>
    </div>
  </header>

  <main class="container">

    <div id="status-banner" class="status-banner" hidden role="alert"></div>

    <section class="card form-card">
      <h2>Add an Expense</h2>
      <form id="expense-form">
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="e.g. Lunch at Java" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="amount">Amount</label>
            <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>
          </div>

          <div class="field">
            <label for="currency">Currency</label>
            <select id="currency" required></select>
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Rent">Rent</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn">Add Expense</button>
      </form>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>Expenses</h2>
        <div class="field">
          <label for="category-filter">Filter by category</label>
          <select id="category-filter">
            <option value="All">All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Rent">Rent</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <ul id="expense-list" class="expense-list"></ul>
      <p id="empty-message" class="empty-message">No expenses yet. Add one above.</p>
    </section>

    <section class="card total-card">
      <h2>Total</h2>
      <p id="total-display" class="total-display">Loading rates...</p>
    </section>

  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
